<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJ-MiX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: DJ-Pult – dunkel, kompakt, kein Text, alles griffbereit
   IDEA: ein Zwei-Deck-Controller: Decks oben, Spuren in der Mitte, Effekt-Pads und Transport unten
   PICTURE: die Spuren A / Effekte / B in der Mitte
   COLOUR and TYPE: Graphit, Koralle A, Blau B, Gelb für aktive Pads; Archivo
   LAYOUT: iPhone quer: Decks nebeneinander, Spuren volle Breite, Pads in zwei Reihen, Transport klebt unten */
:root{color-scheme:dark;--bg:#0d0e13;--panel:#171922;--panel2:#20232f;--ink:#eef0ff;--mute:#9aa0c0;--line:#2b2f40;--a:#ff5a45;--b:#7088ff;--key:#ffd23f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.app{display:grid;gap:8px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));max-width:1500px;margin:0 auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "a" "b" "lanes" "fx" "bar"}
@media(min-width:640px){.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top" "a b" "lanes lanes" "fx fx" "bar bar"}}
.top{grid-area:top;display:flex;align-items:center;gap:10px;min-height:32px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}.logo i{font-style:normal;color:var(--key)}
.ghost{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:600 12px Archivo,sans-serif;cursor:pointer;white-space:nowrap}
.status{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--mute);overflow:hidden;white-space:nowrap}
.status p{margin:0;overflow:hidden;text-overflow:ellipsis}
#d0{grid-area:a}#d1{grid-area:b}.lanes{grid-area:lanes}.fxp{grid-area:fx}.bar{grid-area:bar}
.deck,.lanes,.fxp,.bar{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.deck{padding:7px}
.dh{display:flex;align-items:center;gap:6px}
.tag{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
#d0 .tag{background:var(--a)}#d1 .tag{background:var(--b)}
.deck.on .tag{box-shadow:0 0 0 2px var(--key)}
.play{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.play:disabled{opacity:.3;cursor:default}.play svg{width:14px;height:14px}
.meta{flex:1;min-width:0}
.nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.bpm{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--mute)}
.bpm input{width:60px;font-size:12px!important;height:30px;font:600 13px Archivo,sans-serif;text-align:right;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 6px}
.sm{min-width:30px;height:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:600 12px Archivo,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.sm:disabled{opacity:.4;cursor:default}.sm.key{background:var(--key);color:#12131a;border-color:var(--key)}
.load{position:relative;flex:none;display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font:600 12px Archivo,sans-serif;cursor:pointer}
.load input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.wf{position:relative;height:64px;margin-top:6px;border-radius:8px;background:#0f1118;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wf canvas{position:absolute;inset:0;width:100%;height:100%}
.lanes{padding:5px}
.tl{position:relative;height:clamp(230px,36vw,320px);border-radius:10px;background:#11131b}
.tl canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.edctl{position:absolute;right:5px;top:3px;display:flex;gap:4px}
.chip{min-height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:#0d0e13d9;color:var(--ink);font:600 12px Archivo,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fxp{padding:5px 7px 7px}
.tabs{display:flex;gap:3px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}.tabs::-webkit-scrollbar{display:none}
.tab{height:30px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--mute);font:700 13px Archivo,sans-serif;white-space:nowrap;cursor:pointer;flex:none}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink)}.tab span{color:var(--key);margin-left:3px}
.opt{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mute);white-space:nowrap;flex:none}.opt:first-of-type{margin-left:auto}.opt[hidden]{display:none}
.pads{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;grid-template-rows:repeat(2,auto);gap:5px;overflow-x:auto;scrollbar-width:none;justify-content:start;padding-bottom:2px}.pads::-webkit-scrollbar{display:none}.pads[hidden]{display:none}
.fx{min-width:max-content;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:600 12.5px Archivo,sans-serif;cursor:pointer;white-space:nowrap}
.fx[aria-pressed=true]{background:var(--key);border-color:var(--key);color:#12131a;box-shadow:0 0 14px #ffd23f40}
.fx:disabled{opacity:.4;cursor:default}
.vol{display:grid;gap:6px}.vol[hidden]{display:none}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow b{width:22px;font-size:13px}.vrow .va{color:var(--a)}.vrow .vb{color:var(--b)}.vrow .vf{color:var(--key)}
.vrow input[type=range]{flex:1 1 140px;max-width:260px;height:30px;accent-color:var(--key)}
.vrow output{width:42px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.vrow .lbl{font-size:11px;color:var(--mute)}
.bar{position:sticky;bottom:max(4px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:6px;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none;box-shadow:0 -6px 20px #000a}.bar::-webkit-scrollbar{display:none}
.big{flex:none;height:38px;padding:0 16px;border:0;border-radius:10px;background:var(--key);color:#12131a;font:800 14px Archivo,sans-serif;white-space:nowrap;cursor:pointer}
.big:disabled{opacity:.45;cursor:default}
#out{display:flex;gap:6px;align-items:center;flex:none}#out[hidden]{display:none}
.sep{flex:none;width:1px;height:24px;background:var(--line)}
#dlink{font-size:12px;font-weight:600;color:var(--key);white-space:nowrap}
button:focus-visible,input:focus-visible,.load:focus-within,a:focus-visible{outline:2px solid var(--key);outline-offset:2px}
@media(orientation:landscape) and (max-height:520px){.app{gap:6px}.wf{height:44px}.tl{height:clamp(170px,52vh,240px)}.fx{height:32px}.logo{font-size:16px}}
</style>
</head>

   <div class="wf"><canvas aria-label="Wellenform B – Griffe ziehen zum Bürzen"></canvas></div>

      if(PL&&(PL.A===d||PL.B===d)){const t=d.i===0?PL.aEnd:PL.bStart,x=t/du*W,lab=d.i===0?'Schnitt':'Start',fs=11*dpr;g.fillStyle='#e0a800';g.fillRect(x-1.5*dpr,0,3*dpr,Ht);g.font=`700 ${fs}px Archivo,sans-serif`;const w=g.measureText(lab).width,lx=d.i===0?x-w-6*dpr:x+6*dpr;g.fillStyle='rgba(0,0,0,.65)';g.fillRect(lx-3*dpr,Ht-fs-8*dpr,w+6*dpr,fs+6*dpr);g.fillStyle='#ffd23f';g.fillText(lab,lx,Ht-7*dpr)}}:null);
  }
  if(MIX){const pos=ctx?mpos():0;$('#ot').textContent=fmt(pos)+' / '+fmt(MIX.total);if(MP.playing&&frame%2===0)drawTL()}
  requestAnimationFrame(loop);
}

  {const el=$('.wf',d.el);let mode=null,moved=false,sx=0;

   el.onpointerdown=e=>{if(!d.buf)return;const r=el.getBoundingClientRect(),x=e.clientX-r.left,du=d.buf.duration,W=r.width,xa=d.a/du*W,xb=d.b/du*W,
     yel=PL&&(PL.A===d||PL.B===d)?(d.i===0?PL.aEnd:PL.bStart)/du*W:null,near=v=>v!=null&&Math.abs(x-v)<26;

   el.onpointerup=el.onpointercancel=e=>{if(!mode)return;const m=mode;mode=null;

{const tl=$('#tl');
 tl.onpointerdown=e=>{if(!PL||!TLX||busy)return;const r=tl.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,H=r.height,spp=(TLX.v1-TLX.v0)/r.width,top=16,lh=H-34,yF=top+lh*.3,yB=yF+lh*.4,lnH=lh*.4/NL,xG=(TLX.G-TLX.v0)/spp,tt=TLX.v0+x*spp;

   ED={mode,clip,c0,top,lh,yB,fa0:FADE.a,fb0:FADE.b,va0:VOL.a,vb0:VOL.b,sx:e.clientX,sy:e.clientY,lnH,spp,a0:PL.aEnd,b0:PL.bStart,off0:bOff,G0:TLX.G,Gfx:TLX.Gfx,moved:false};try{tl.setPointerCapture(e.pointerId)}catch(_){}drawTL()};
 tl.onpointermove=e=>{if(!ED||!PL)return;const dt=(e.clientX-ED.sx)*ED.spp,p=PL,A=p.A,B=p.B;if(Math.abs(e.clientX-ED.sx)>2||Math.abs(e.clientY-ED.sy)>6)ED.moved=true;if(!ED.moved)return;

   else{gAuto=false;bOff=sn(ED.G0+dt)}

 tl.onpointerup=tl.onpointercancel=()=>{if(!ED)return;const m=ED.moved;ED=null;drawTL();if(m){replan();autoHear()}}}
